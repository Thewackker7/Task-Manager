name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # A real PostgreSQL runs next to the job, just like in docker-compose.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: taskpass
          POSTGRES_DB: taskdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskuser -d taskdb_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://taskuser:taskpass@localhost:5432/taskdb_test
      TEST_DATABASE_URL: postgresql+psycopg://taskuser:taskpass@localhost:5432/taskdb_test
      # Throwaway value used only inside CI
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check migrations are in sync with models
        # Fails if someone changed a model but forgot to create a migration.
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Run tests
        run: pytest
